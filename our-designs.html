<main id="main">
  <div class="wrap page-head">
    <h1>Our Designs</h1>
    <p>Every design here was created by the officers of CARES, then painted by our team for healthcare facilities.</p>
  </div>
  <section class="designs">
    <div class="wrap">
      <div class="design-grid">
        <figure class="design">
          <div class="mat"><img src="images/designs/light-in-the-dark.jpg" alt="A glowing rainbow jellyfish drifting through kelp, fish, and bubbles on the ocean floor" loading="lazy"></div>
          <figcaption>
            <h2>Light in the Dark</h2>
            <p>Jellyfish use their bioluminescence to illuminate the unknown and to protect themselves through illusion. This piece is intended to inspire people to use their inner light to navigate during dark times like the pandemic.</p>
          </figcaption>
        </figure>
        <figure class="design">
          <div class="mat"><img src="images/designs/burst-of-blooms.jpg" alt="A hummingbird flying toward a birdhouse above colorful sunflowers and dahlias" loading="lazy"></div>
          <figcaption>
            <h2>Burst of Blooms</h2>
            <p>Throughout history, hummingbirds have been an important sign of life, freedom, and endurance. This art piece signifies staying true to these qualities, displaying many bright colors to symbolize joy and happiness.</p>
          </figcaption>
        </figure>
        <figure class="design">
          <div class="mat"><img src="images/designs/deep-into-the-woods.jpg" alt="A spotted deer standing in a green forest clearing with mushrooms and tall trees" loading="lazy"></div>
          <figcaption>
            <h2>Deep Into the Woods</h2>
            <p>This art piece was inspired by Robert Frost's poem, "Stopping by the Woods on a Snowy Evening". The literary work emphasizes the message of moving forward in life. One of the notable details in the piece is the description of the woods, which we try to emulate in this painting.</p>
          </figcaption>
        </figure>
        <figure class="design">
          <div class="mat"><img src="images/designs/wildest-dreams.jpg" alt="Bookshelves filled with books, flowers, a potted plant, and a lit candle" loading="lazy"></div>
          <figcaption>
            <h2>Wildest Dreams</h2>
            <p>As Mason Cooley, a popular American aphorist, once said, "Reading gives us someplace to go when we have to stay where we are." This painting reminds viewers to let their imagination run loose and turn to literature during hard times.</p>
          </figcaption>
        </figure>
        <figure class="design">
          <div class="mat"><img src="images/designs/tranquility.jpg" alt="Two koi fish swimming over stones and lily pads in a pond" loading="lazy"></div>
          <figcaption>
            <h2>Tranquility</h2>
            <p>This piece shows the peace and serenity of koi ponds. In Japanese culture, koi ponds are often kept to bring good luck and good fortune. They are also associated with perseverance and strength.</p>
          </figcaption>
        </figure>
        <figure class="design">
          <div class="mat"><img src="images/designs/inner-strength.jpg" alt="A brown horse standing in front of a red barn and wooden fence" loading="lazy"></div>
          <figcaption>
            <h2>Inner Strength</h2>
            <p>Horses are a symbol of endurance, confidence, and triumph. This piece reminds us the importance of these traits in the face of adversity.</p>
          </figcaption>
        </figure>
      </div>
    </div>
  </section>
